# Base Hydra config for DPF smoke tests (5 steps, sanity check only)

defaults:
  - _self_
  - optional dpf_smoke: null
  - override hydra/job_logging: default
  - override hydra/hydra_logging: default

dtype: float64
tf_log_level: 2

hydra:
  run:
    dir: outputs/dpf_smoke/${hydra:runtime.choices.dpf_smoke}
  sweep:
    dir: outputs/dpf_smoke
    subdir: ${hydra.job.override_dirname}
