# @package _global_
# DPF: Kitagawa model with Bootstrap PF + soft resampling + gradient
#
# Bootstrap PF baseline (no flow). Infers sigma_V and sigma_W (true: 3.162, 1.0).
# Soft resampling (PF-net style): blends weights with uniform distribution.

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0
  initial_var: 5.0

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 1000
  resampling_method: soft
  resampling_config:
    alpha: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: soft
  hmc_resampling_config:
    alpha: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.15          # log(sqrt(10)) ~ 1.15
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 10
    num_burnin: 15
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42
    grad_clip_norm: 100.0

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
