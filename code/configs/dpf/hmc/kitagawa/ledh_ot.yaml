# @package _global_
# DPF: Kitagawa model with OT resampling (epsilon=0.5) + gradient through resampling
#
# Standard OT resampling. Gradient flows through Sinkhorn transport matrix.

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 15
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  # Gradient flows through OT resampling
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.15          # log(sqrt(10)) ~ 1.15
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 10
    num_burnin: 15
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42
    grad_clip_norm: 100.0

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
