# @package _global_
# DPF: 1D Linear-Gaussian model with Bootstrap PF + OT resampling (epsilon=0.5) + gradient
#
# Bootstrap PF baseline (no flow). Infers obs_noise_std (true: 1.0).
# Gradient flows through Sinkhorn transport matrix.

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.0

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 500
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25          # log(1.0) + 0.25, mode=1.0
        scale: 0.5

  hmc:
    num_samples: 400
    num_burnin: 200
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    obs_noise_std: 1.0
