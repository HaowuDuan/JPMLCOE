# @package _global_
# LG + BPF+OT HMC, LONG chain 3 of 4 (for R-hat, num_samples=2000)
# Varies: seed=44, obs_noise_std init=1.5

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 1.5

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 500
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  eager_mode: false

dpf:
  sampler: hmc
  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25
        scale: 0.5
  hmc:
    num_samples: 2000
    num_burnin: 500
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 44

data:
  T: 50
  seed: 42
  true_params:
    obs_noise_std: 1.0
