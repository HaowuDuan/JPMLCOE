# @package _global_
# DPF: 1D Linear-Gaussian model with KF + HMC parameter inference
#
# KalmanFilter accepts an optional model parameter for HMC compatibility.
# log_marginal_likelihood_tf reads observation_cov() / state_transition_cov()
# dynamically from the model, preserving gradients through obs_noise_std.
# Infers obs_noise_std (true: 1.0).

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.0    # Initial guess (true: 1.0)

filter:
  _target_: src.filters.kalman.kalman.KalmanFilter
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  mean_0: [0.0]
  Sigma_0: [[1.0]]
  use_joseph_form: true

dpf:
  sampler: hmc

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 200
    num_burnin: 100
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    obs_noise_std: 1.0
