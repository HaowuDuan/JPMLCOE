# @package _global_
# LG + Kalman HMC, chain 4 of 4 (for R-hat)
# Varies: seed=45, obs_noise_std init=2.5

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.5

filter:
  _target_: src.filters.kalman.kalman.KalmanFilter
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  mean_0: [0.0]
  Sigma_0: [[1.0]]
  use_joseph_form: true

dpf:
  sampler: hmc

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 400
    num_burnin: 200
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 45

data:
  T: 50
  seed: 42
  true_params:
    obs_noise_std: 1.0
