# @package _global_
# DPF: Range-Bearing model with soft resampling (alpha=0.5) + gradient through resampling
#
# Infers sigma_range and sigma_bearing (true: 0.1, 0.1).
# Soft resampling (PF-net style): blends weights with uniform distribution.
# Simpler gradient than OT Sinkhorn.

model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.3      # Initial guess (true: 0.1)
  sigma_bearing: 0.3    # Initial guess (true: 0.1)

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 500
  n_lambda_steps: 15
  resampling_method: soft
  resampling_config:
    alpha: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_range:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3     # log(0.1) ~ -2.3 — prior centered near true value
        scale: 0.5
    sigma_bearing:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3
        scale: 0.5

  hmc:
    num_samples: 10
    num_burnin: 15
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    sigma_range: 0.1
    sigma_bearing: 0.1
