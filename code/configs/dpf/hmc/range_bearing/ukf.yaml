# @package _global_
# DPF: Range-Bearing model with UKF + HMC parameter inference
#
# UKF uses sigma-point approximation for the nonlinear range/bearing observation.
# Infers sigma_range and sigma_bearing (true: 0.1, 0.1).

model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.3       # Initial guess (true: 0.1)
  sigma_bearing: 0.3     # Initial guess (true: 0.1)

filter:
  _target_: src.filters.kalman.unscented_kalman.UnscentedKalmanFilter
  alpha: 1.0
  beta: 2.0
  kappa: 0.0
  sample_initial_mean: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_range:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3          # log(0.1) ~ -2.3
        scale: 0.5
    sigma_bearing:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3          # log(0.1) ~ -2.3
        scale: 0.5

  hmc:
    num_samples: 1000
    num_burnin: 100
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    sigma_range: 0.1
    sigma_bearing: 0.1
