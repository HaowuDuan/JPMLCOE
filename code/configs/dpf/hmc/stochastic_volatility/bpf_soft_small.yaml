# @package _global_
# DPF: Stochastic Volatility model with Bootstrap PF + soft resampling + gradient
#
# Bootstrap PF baseline (no flow). Infers alpha, sigma, beta (true: 0.91, 1.0, 0.5).
# Soft resampling (PF-net style): blends weights with uniform distribution.
# Small-N run: T=300, N=100 particles, 2000 samples, 1000 burn-in, target_accept_prob=0.7.

model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.8       # Initial guess (true: 0.91)
  sigma: 1.5       # Initial guess (true: 1.0)
  beta: 0.3        # Initial guess (true: 0.5)

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 100
  resampling_method: soft
  resampling_config:
    alpha: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: soft
  hmc_resampling_config:
    alpha: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    alpha:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -0.094        # log(0.91) ~ -0.094
        scale: 0.5
    sigma:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0           # log(1.0) = 0
        scale: 0.5
    beta:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -0.693        # log(0.5) ~ -0.693
        scale: 0.5

  hmc:
    num_samples: 2000
    num_burnin: 1000
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 42
    grad_clip_norm: 100.0

data:
  T: 300
  seed: 42
  true_params:
    alpha: 0.91
    sigma: 1.0
    beta: 0.5
