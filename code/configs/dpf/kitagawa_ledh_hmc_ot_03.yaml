# @package _global_
# DPF: Kitagawa model with OT resampling (epsilon=0.3) + gradient through resampling
#
# Moderate OT resampling. Gradient flows through Sinkhorn transport matrix.

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 5.0       # Initial guess (true: 10.0)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.3
  weight_clip_range: 50.0
  # Gradient flows through OT resampling
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.3
  eager_mode: false

dpf:
  sampler: custom_hmc

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 2.3
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 500
    num_burnin: 250
    step_size: 0.01
    num_leapfrog_steps: 10
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.7
    seed: 42
    grad_clip_norm: 100.0

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 10.0
    sigma_W: 1.0
