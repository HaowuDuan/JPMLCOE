# @package _global_
# DPF: Infer noise parameters of Kitagawa model using HMC-optimized LEDH
#
# Uses LEDHParticleFlowFilterHMC which has:
# - Compiled flow loop (@tf.function) for faster backward pass
# - Optional stop_gradient on resampling (default: on)
# - When stop_gradient is on, uses systematic resampling (cheaper than OT)
# - No diagnostic tracking in the HMC code path
#
# To test with full gradient through OT resampling (slower but theoretically richer):
#   filter.stop_gradient_resampling=false
#   filter.hmc_resampling_method=ot_entropy
#   filter.hmc_resampling_config.epsilon=0.5

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 5.0       # Initial guess (true: 10.0)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy       # used by filter() path (standalone filtering)
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  # HMC-specific settings
  stop_gradient_resampling: true      # cut gradient through resampling
  eager_mode: false                   # set true for instant error debugging
  # hmc_resampling_method defaults to 'systematic' when stop_gradient is true
  # hmc_resampling_config defaults to {} when using systematic

dpf:
  sampler: custom_hmc
  debug_gradients: true

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 2.3          # log(10) ~ 2.3
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 500
    num_burnin: 250
    step_size: 0.01
    num_leapfrog_steps: 10
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.7
    seed: 42
    grad_clip_norm: 100.0

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 10.0
    sigma_W: 1.0
