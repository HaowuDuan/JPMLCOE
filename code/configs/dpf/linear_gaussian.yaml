# Differentiable Filter Parameter Inference Configuration
# Example: Linear Gaussian Model (inferring noise parameters)

# Base model configuration
model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  # State transition: x_{t+1} = F*x_t + B*v_t
  F: [[0.9, 0.1], [0.0, 0.8]]  # State transition matrix
  B: [[1.0], [0.5]]             # Process noise matrix (to be scaled by sigma_v)
  H: [[1.0, 0.0]]               # Observation matrix
  D: [[1.0]]                    # Observation noise matrix (to be scaled by sigma_w)
  mu_0: [0.0, 0.0]              # Initial state mean
  Sigma_0: [[1.0, 0.0], [0.0, 1.0]]  # Initial state covariance

# Filter configuration (Kalman filter is optimal for linear Gaussian)
filter:
  _target_: src.filters.kalman.extended_kalman.ExtendedKalmanFilter
  sample_initial_mean: false

# DPF configuration
dpf:
  # Note: For LinearGaussianModel, we typically infer noise scale parameters
  # This requires modifying the model to expose these as parameters
  # Here's an example if the model had 'process_noise_scale' and 'obs_noise_scale'
  trainable_params:
    # Example parameters (model must have these attributes)
    # process_noise_scale:
    #   init_value: 1.0
    #   constraint: positive
    #   prior:
    #     _target_: tensorflow_probability.distributions.HalfNormal
    #     scale: 1.0
    
    # obs_noise_scale:
    #   init_value: 1.0
    #   constraint: positive
    #   prior:
    #     _target_: tensorflow_probability.distributions.HalfNormal
    #     scale: 1.0
  
  # HMC configuration
  hmc:
    num_samples: 1000
    num_burnin: 500
    step_size: 0.02
    num_leapfrog_steps: 5
    adaptation_rate: 0.8
    target_accept_prob: 0.75
    seed: 42

# Data generation
data:
  T: 100
  seed: 42

# Output configuration
output:
  save_samples: true
  save_diagnostics: true
  plot_traces: true
  plot_posteriors: true


