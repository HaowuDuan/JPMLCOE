# @package _global_
# MAP: Cubic Sensor with LEDH + Adam optimizer
# Infers sigma_V and sigma_W (true: 1.0, 1.0).

dtype: float32

model:
  _target_: src.models.cubic_sensor.CubicSensorModel
  a: 0.9
  c: 0.05
  sigma_V: 5.0       # Initial guess (true: 1.0)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 200
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  map:
    num_steps: 200
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 1.0
    sigma_W: 1.0
