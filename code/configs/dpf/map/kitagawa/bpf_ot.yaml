# @package _global_
# MAP: Kitagawa with BPF + Adam optimizer
# Infers sigma_V and sigma_W (true: 3.162, 1.0).

dtype: float32

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0
  initial_var: 5.0

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 1000
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.40          # log(sqrt(10)) + 0.25 ~ 1.40, mode=sqrt(10)
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25
        scale: 0.5

  map:
    num_steps: 200
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
