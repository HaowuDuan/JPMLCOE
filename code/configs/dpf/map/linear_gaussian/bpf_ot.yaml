# @package _global_
# MAP: 1D Linear-Gaussian with BPF + Adam optimizer
# Infers obs_noise_std (true: 1.0).

dtype: float32

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.0    # Initial guess (true: 1.0)

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 500
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
    extrapolation_damping: 0.5
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25
        scale: 0.5

  map:
    num_steps: 300
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    obs_noise_std: 1.0
