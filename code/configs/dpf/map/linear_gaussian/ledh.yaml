# @package _global_
# MAP: 1D Linear-Gaussian with LEDH + Adam optimizer
# Infers obs_noise_std (true: 1.0).

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.0    # Initial guess (true: 1.0)

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 200
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  map:
    num_steps: 200
    learning_rate: 0.01
    optimizer: adam
    random_seed: false
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    obs_noise_std: 1.0
