# @package _global_
# MAP: 1D Stochastic Volatility with LEDH + OT resampling + Adam optimizer
# Uses log_space=True for EKF compatibility.
# Infers alpha only (true: 0.91). sigma and beta fixed.

dtype: float32

model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.8       # Initial guess (true: 0.91)
  sigma: 1.0
  beta: 0.5
  log_space: true

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    alpha:
      constraint: [0.001, 0.999]
      prior:
        _target_: tensorflow_probability.distributions.Uniform
        low: 0.0
        high: 1.0

  map:
    num_steps: 300
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    alpha: 0.91
