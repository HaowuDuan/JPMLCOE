# @package _global_
# MAP: 2D SV with LEDH + OT resampling — Level 1: infer a1 only
# True: a1=0.95, a2=0.91, sigma1=0.5, sigma2=1.0, b=1.0 (fixed)

dtype: float32

model:
  _target_: src.models.stochastic_volatility_2d.StochasticVolatility2DModel
  a1: 0.7              # Initial guess (true: 0.95)
  a2: 0.91
  sigma1: 0.5
  sigma2: 1.0
  b: 1.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    a1:
      constraint: [0.001, 0.999]
      prior:
        _target_: tensorflow_probability.distributions.Beta
        concentration1: 19.05    # mode = 0.95
        concentration0: 1.95

  map:
    num_steps: 300
    learning_rate: 0.01
    optimizer: adam
    random_seed: false
    seed: 42

data:
  T: 200
  seed: 42
  true_params:
    a1: 0.95
