# @package _global_
# MAP: 2D SV with LEDH + OT resampling — Level 2: infer a2 + sigma2
# True: a1=0.95, a2=0.91, sigma1=0.5, sigma2=1.0, b=1.0 (fixed)

dtype: float32

model:
  _target_: src.models.stochastic_volatility_2d.StochasticVolatility2DModel
  a1: 0.95
  a2: 0.7            # Initial guess (true: 0.91)
  sigma1: 0.5
  sigma2: 2.0        # Initial guess (true: 1.0)
  b: 1.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    a2:
      constraint: [0.001, 0.999]
      prior:
        _target_: tensorflow_probability.distributions.Beta
        concentration1: 17.38    # mode = 0.91
        concentration0: 2.62
    sigma2:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25          # log(1.0) + 0.25, mode=1.0
        scale: 0.5

  map:
    num_steps: 300
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 200
  seed: 42
  true_params:
    a2: 0.91
    sigma2: 1.0
