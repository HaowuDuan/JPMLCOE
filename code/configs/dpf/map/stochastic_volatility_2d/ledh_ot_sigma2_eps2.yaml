# @package _global_
# MAP: 2D SV with LEDH + OT resampling — epsilon=2.0 smoothing sweep
# Identical to ledh_ot_sigma2.yaml except OT epsilon raised from 0.5 to 2.0.
# Purpose: test Codex hypothesis #3 that higher OT epsilon smooths the
# particle-filter log-likelihood surface enough for MAP to converge from
# sigma2=2.0 initial guess.
# True: a1=0.95, a2=0.91, sigma1=0.5, sigma2=1.0, b=1.0 (fixed)

dtype: float32

model:
  _target_: src.models.stochastic_volatility_2d.StochasticVolatility2DModel
  a1: 0.95
  a2: 0.91
  sigma1: 0.5
  sigma2: 2.0       # Initial guess (true: 1.0)
  b: 1.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 2.0      # smoothing sweep: raised from 0.5 default
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    sigma2:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.25           # log(1.0) + 0.25 = 0.25, mode=1.0
        scale: 0.5

  map:
    num_steps: 300
    learning_rate: 0.01
    optimizer: adam
    random_seed: false
    seed: 42

data:
  T: 200
  seed: 42
  true_params:
    sigma2: 1.0
