# @package _global_
# Experiment: HMC + PGibbs + Bootstrap CSMC
#
# PGibbs + HMC theta-step + Bootstrap CSMC x-step
# HMC on closed-form p(theta | x, y) — no gradient through PF
# Bootstrap CSMC for trajectory sampling (simpler but less efficient than LEDH)
#
# Run: python -m src.experiments.run_dpf_experiment dpf=pgibbs/kitagawa_bpf_hmc

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.conditional_smc.BootstrapConditionalSMC
  n_particles: 1000
  resample_threshold: 0.5
  ancestor_sampling: true

dpf:
  sampler: pgibbs

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.15         # log(sqrt(10)) ~ 1.15
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  pgibbs:
    theta_sampler: hmc
    num_samples: 2000
    num_burnin: 1000
    hmc_steps_per_iter: 5
    hmc_step_size: 0.05
    hmc_num_leapfrog: 10
    target_accept_prob: 0.8
    grad_clip_norm: 100.0
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
