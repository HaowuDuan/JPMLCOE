# @package _global_
# Experiment 1: Reproduce PMCMC paper (Andrieu et al. 2010)
#
# PGibbs + MH theta-step + Bootstrap CSMC x-step
# Metropolis-Hastings random walk for theta | x, y (closed-form target)
# Bootstrap CSMC for x | theta, y (with ancestor sampling)
#
# Run: python -m src.experiments.run_dpf_experiment dpf=pgibbs/kitagawa_bpf_mh

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.conditional_smc.BootstrapConditionalSMC
  n_particles: 1000
  resample_threshold: 0.5
  ancestor_sampling: true

dpf:
  sampler: pgibbs

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.15         # log(sqrt(10)) ~ 1.15
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  pgibbs:
    theta_sampler: mh
    num_samples: 2000
    num_burnin: 1000
    mh_proposal_std: 0.1     # in unconstrained (log) space
    mh_steps_per_iter: 1     # 1 MH step per Gibbs iteration
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
