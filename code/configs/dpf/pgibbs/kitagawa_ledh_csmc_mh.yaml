# @package _global_
# Experiment: MH + PGibbs + LEDH CSMC
#
# PGibbs + MH theta-step + LEDH CSMC x-step
# Metropolis-Hastings random walk for theta | x, y (closed-form target)
# LEDH CSMC for trajectory sampling — better proposals than bootstrap
#
# Run: python -m src.experiments.run_dpf_experiment dpf=pgibbs/kitagawa_ledh_csmc_mh

model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 2.0       # Initial guess (true: 3.162)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_csmc.LEDHConditionalSMC
  n_particles: 500
  n_lambda_steps: 15
  regularization: 1.0e-8
  resample_threshold: 0.5
  ancestor_sampling: true

dpf:
  sampler: pgibbs

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 1.15         # log(sqrt(10)) ~ 1.15
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  pgibbs:
    theta_sampler: mh
    num_samples: 2000
    num_burnin: 1000
    mh_proposal_std: 0.1
    mh_steps_per_iter: 1
    seed: 42

data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 3.162
    sigma_W: 1.0
