# @package _global_
# DPF: Infer observation noise parameters of Range-Bearing model using TFP HMC + LEDH filter
#
# Infers sigma_range and sigma_bearing (true: 0.1, 0.1).
# Uses LEDHParticleFlowFilterHMC eager path (compiled path is Kitagawa-specific).

model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.3      # Initial guess (true: 0.1)
  sigma_bearing: 0.3    # Initial guess (true: 0.1)

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 500
  n_lambda_steps: 29
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: true
  eager_mode: true      # compiled path has Kitagawa-specific sigma_V/sigma_W signatures

dpf:
  sampler: hmc    # TFP tfp.mcmc.HamiltonianMonteCarlo

  trainable_params:
    sigma_range:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3     # log(0.1) ~ -2.3 — prior centered near true value
        scale: 0.5
    sigma_bearing:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3
        scale: 0.5

  hmc:
    num_samples: 500
    num_burnin: 250
    step_size: 0.01
    num_leapfrog_steps: 10
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.7
    seed: 42

data:
  T: 200
  seed: 42
  true_params:
    sigma_range: 0.1
    sigma_bearing: 0.1
