# @package _global_
# DPF: Cubic Sensor model with OT resampling (epsilon=0.5) + gradient through resampling
#
# Mildly nonlinear 1D model: y = x + 0.05*x^3 + w.
# Between linear-Gaussian and Kitagawa in difficulty.
# Gradient flows through Sinkhorn transport matrix.

model:
  _target_: src.models.cubic_sensor.CubicSensorModel
  a: 0.9
  c: 0.05
  sigma_V: 2.0       # Initial guess (true: 1.0)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.particle.ledh_invertible_hmc.LEDHParticleFlowFilterHMC
  n_particles: 1000
  n_lambda_steps: 15
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  weight_clip_range: 50.0
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0          # log(1.0) = 0
        scale: 1.0
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 3
    num_burnin: 2
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    sigma_V: 1.0
    sigma_W: 1.0
