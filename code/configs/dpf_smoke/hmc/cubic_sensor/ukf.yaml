# @package _global_
# DPF: Cubic Sensor model with UKF + HMC parameter inference
#
# UKF uses sigma-point approximation (no Jacobian required).
# alpha=1.0 avoids catastrophic cancellation in 1D (see test_kalman_family.py).
# Infers sigma_V and sigma_W (true: 1.0, 1.0).

model:
  _target_: src.models.cubic_sensor.CubicSensorModel
  a: 0.9
  c: 0.05
  sigma_V: 2.0       # Initial guess (true: 1.0)
  sigma_W: 2.0       # Initial guess (true: 1.0)
  initial_var: 5.0

filter:
  _target_: src.filters.kalman.unscented_kalman.UnscentedKalmanFilter
  alpha: 1.0    # Spread of sigma points; 1.0 avoids negative zeroth weight in 1D
  beta: 2.0     # Prior knowledge (2 = Gaussian)
  kappa: 0.0
  sample_initial_mean: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 3
    num_burnin: 2
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    sigma_V: 1.0
    sigma_W: 1.0
