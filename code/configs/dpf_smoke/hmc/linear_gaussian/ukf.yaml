# @package _global_
# DPF: 1D Linear-Gaussian model with UKF + HMC parameter inference
#
# UKF uses sigma-point approximation; on a linear model it is mathematically
# equivalent to KF (see test_kalman_family.py). alpha=1.0 for 1D stability.
# Infers obs_noise_std (true: 1.0).

model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F: [[0.9]]
  B: [[1.0]]
  H: [[1.0]]
  D: [[1.0]]
  obs_noise_std: 2.0    # Initial guess (true: 1.0)

filter:
  _target_: src.filters.kalman.unscented_kalman.UnscentedKalmanFilter
  alpha: 1.0    # Spread of sigma points; 1.0 avoids negative zeroth weight in 1D
  beta: 2.0     # Prior knowledge (2 = Gaussian)
  kappa: 0.0
  sample_initial_mean: false

dpf:
  sampler: hmc

  trainable_params:
    obs_noise_std:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0

  hmc:
    num_samples: 3
    num_burnin: 2
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    obs_noise_std: 1.0
