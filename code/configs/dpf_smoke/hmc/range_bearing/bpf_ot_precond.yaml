# @package _global_
# DPF: Range-Bearing model with Bootstrap PF + OT resampling (epsilon=0.5)
#
# Preconditioned HMC with diagonal mass matrix.
# Infers sigma_range and sigma_bearing (true: 0.1, 0.1).
# Gradient flows through Sinkhorn transport matrix.

model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.3
  sigma_bearing: 0.3

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 500
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
  eager_mode: false

dpf:
  sampler: hmc

  trainable_params:
    sigma_range:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3
        scale: 0.5
    sigma_bearing:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.3
        scale: 0.5

  hmc:
    num_samples: 3
    num_burnin: 2
    step_size: 0.01
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.65
    seed: 42
    # Diagonal mass matrix: m_i large → smaller leapfrog step in dim i.
    # Tune if one parameter has a much steeper posterior than the other.
    # Rule of thumb: m_i ≈ 1 / posterior_var_i in unconstrained space.
    mass_vector: [1.0, 5.0]

data:
  T: 50
  seed: 42
  true_params:
    sigma_range: 0.1
    sigma_bearing: 0.1
