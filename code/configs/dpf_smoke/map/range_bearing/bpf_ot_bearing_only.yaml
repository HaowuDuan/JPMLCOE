# @package _global_
# MAP: Range-Bearing with Bootstrap PF + OT resampling (epsilon=0.5) + Adam
#
# Freeze sigma_range at true value (0.1), optimize sigma_bearing only.
# Diagnostic: isolate whether sigma_bearing gradient alone points to truth.

dtype: float32

model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.1  # frozen at true value
  sigma_bearing: 0.3

filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 2000
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  stop_gradient_resampling: false
  eager_mode: false

dpf:
  sampler: map

  trainable_params:
    sigma_bearing:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: -2.05
        scale: 0.5

  map:
    num_steps: 5
    learning_rate: 0.01
    optimizer: adam
    random_seed: true
    seed: 42

data:
  T: 50
  seed: 42
  true_params:
    sigma_range: 0.1
    sigma_bearing: 0.1
