# @package _global_

# Experiment: Standard Kalman Filter on Range-Bearing Model
# h(x) is nonlinear so H is linearized at the initial mean x0=[1,1], sensor=[0,0]:
#   r=sqrt(2), H=[[dx/r, dy/r],[-dy/r², dx/r²]] = [[0.7071,0.7071],[-0.5,0.5]]
# Fixed H is only valid near the linearization point — degrades as state drifts.

defaults:
  - override /model: range_bearing
  - override /filter: kalman_joseph

T: 500
seed: 42
plot: true
output_dir: outputs/range_bearing/range_bearing_kf

filter:
  F: [[1.0, 0.0], [0.0, 1.0]]
  B: [[0.1, 0.0], [0.0, 0.1]]
  H: [[0.7071, 0.7071], [-0.5, 0.5]]
  D: [[0.1, 0.0], [0.0, 0.1]]
  mean_0: [1.0, 1.0]
  Sigma_0: [[1.0, 0.0], [0.0, 1.0]]
