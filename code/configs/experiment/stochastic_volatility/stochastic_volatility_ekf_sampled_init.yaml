# @package _global_

# Experiment: Extended Kalman Filter on Stochastic Volatility Model
# with initial mean sampled from stationary distribution

defaults:
  - override /model: stochastic_volatility
  - override /filter: ekf

# Override settings
T: 100
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_ekf_sampled_init

# Filter with sampled initial mean
filter:
  sample_initial_mean: true
  random_seed: 42
