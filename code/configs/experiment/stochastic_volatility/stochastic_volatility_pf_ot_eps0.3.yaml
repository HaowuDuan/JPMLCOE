# @package _global_

# Experiment: Bootstrap Particle Filter with OT Resampling (epsilon=0.3) on Stochastic Volatility
# Low-medium epsilon = moderately sharp transport

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_ot

# Override settings
T: 500
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_ot_eps0.3

# Override filter parameters
filter:
  resampling_config:
    epsilon: 0.3
    max_iter: 120
    convergence_threshold: 0.001
    epsilon_scaling: 0.87

