# @package _global_

# Experiment: Bootstrap Particle Filter with OT Resampling (epsilon=0.5) on Stochastic Volatility
# Medium epsilon = balanced smoothing (default in particle_tf_ot.yaml)

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_ot

# Override settings
T: 100
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_ot_eps0.5

# Note: epsilon=0.5 is the default in particle_tf_ot.yaml
# This file is included for explicit comparison purposes

