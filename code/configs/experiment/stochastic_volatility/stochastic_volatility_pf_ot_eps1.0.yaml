# @package _global_

# Experiment: Bootstrap Particle Filter with OT Resampling (epsilon=1.0) on Stochastic Volatility
# Higher epsilon = more smoothing, less transport bias, better for difficult problems

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_ot

# Override settings
T: 100
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_ot_eps1.0

# Override filter parameters for higher entropy
filter:
  resampling_config:
    epsilon: 1.0  # More entropy regularization = smoother transport
    max_iter: 100
    convergence_threshold: 0.001
    epsilon_scaling: 0.9

