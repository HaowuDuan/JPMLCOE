# @package _global_

# Experiment: Bootstrap Particle Filter with Soft Resampling (alpha=0.9) on Stochastic Volatility
# Higher alpha = closer to standard particle filter (default in particle_tf_soft.yaml)

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_soft

# Override settings
T: 100
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_soft_alpha0.9

# Note: alpha=0.9 is the default in particle_tf_soft.yaml
# This file is included for explicit comparison purposes

