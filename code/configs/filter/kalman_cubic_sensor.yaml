# Kalman Filter for Cubic Sensor Model — linearized at x=0
#
# The cubic sensor observation h(x) = x + c*x^3 is linearized at x=0:
#   h'(0) = 1 + 3*c*0^2 = 1
# so H = [[1]]. This is the optimal linear filter for this linearization
# and serves as a baseline; EKF/UKF are more accurate for c > 0.

_target_: src.filters.kalman.kalman.KalmanFilter
_recursive_: false

F:
  - - ${model.a}           # State transition
B:
  - - ${model.sigma_V}     # Process noise factor
H:
  - - 1.0                  # Observation (linearized at x=0)
D:
  - - ${model.sigma_W}     # Observation noise factor
mean_0:
  - 0.0
Sigma_0:
  - - ${model.initial_var}
use_joseph_form: true
