# Bootstrap Particle Filter - TensorFlow with Soft Resampling
# Soft resampling is differentiable and maintains gradients through resampling

_target_: src.filters.particle.bootstrap_pf_tf.ParticleFilterTF

# Model will be passed at runtime from experiment
_recursive_: false

n_particles: 1000          # Number of particles
resample_threshold: 0.5    # Resample when ESS/N < threshold

# Soft resampling configuration
resampling_method: 'soft'  # String identifier for soft_resample

resampling_config:
  alpha: 0.9  # Trade-off parameter: 1.0=hard resampling, 0.0=uniform sampling
              # Higher alpha = closer to standard particle filter
              # Lower alpha = more exploration, maintains gradients better

