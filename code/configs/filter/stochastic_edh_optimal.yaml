_target_: src.filters.particle.stochastic_edh.StochasticEDHFlow

n_particles: 500
n_lambda_steps: 100
diffusion_scale: 0.0  # Scalar q for Q = q*I. 0.0 = deterministic flow
schedule_func: null  # null with use_optimal_schedule=True will compute optimal β(λ)
n_threads: null  # null = use CPU count

# Stiffness mitigation via optimal schedule (Dai & Daum 2021)
use_optimal_schedule: true  # Compute optimal stiffness-mitigating schedule
use_ekf_covariance: true  # Use EKF covariance instead of empirical
