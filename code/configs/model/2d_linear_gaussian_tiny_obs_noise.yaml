# 2D Linear Gaussian Model with Tiny Observation Noise
# Tests numerical stability of Joseph form vs standard form
# Matches the setup from solutions_kalman.ipynb

_target_: src.models.linear_gaussian.LinearGaussianModel

# 2D system with independent dimensions
# X_{n} = F * X_{n-1} + B * V_n,  V_n ~ N(0, I)
# Y_{n} = H * X_n + D * W_n,  W_n ~ N(0, I)

F: [[0.95, 0.0],
    [0.0, 0.95]]

B: [[1.0, 0.0],
    [0.0, 1.0]]

H: [[1.0, 0.0],
    [0.0, 1.0]]

D: [[1.0e-8, 0.0],
    [0.0, 1.0e-8]]  # Extremely tiny observation noise

# Initial state distribution
mu_0: [0.0, 0.0]

Sigma_0: [[1.0, 0.0],
          [0.0, 1.0]]
