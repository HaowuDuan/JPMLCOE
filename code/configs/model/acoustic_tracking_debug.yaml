# Acoustic Tracking Model Configuration - DEBUG VERSION (Easier)

_target_: src.models.acoustic_tracking.AcousticTrackingModel

# Sensor configuration (4 sensors at corners of 40m x 40m area)
sensor_positions:
  - [0.0, 0.0]      # Bottom-left
  - [40.0, 0.0]     # Bottom-right
  - [0.0, 40.0]     # Top-left
  - [40.0, 40.0]    # Top-right

# Source parameters (from Li & Coates paper)
source_intensity: 10.0        # Ψ = 10 in paper
regularization: 0.1           # d_0 = 0.1 in paper

# Measurement noise (REDUCED for easier debugging - paper uses 0.1)
measurement_noise_std: 0.01  # Reduced from 0.1 for better SNR (~10 instead of ~0.1)

# Process noise covariance (paper's filter covariance from Section V)
# Q = (1/20) * [[1/3, 0, 0.5, 0], [0, 1/3, 0, 0.5], [0.5, 0, 1, 0], [0, 0.5, 0, 1]]
# Note: This is handled by default in the model, but can be overridden here
process_noise_cov: null

# Time step
dt: 1.0
