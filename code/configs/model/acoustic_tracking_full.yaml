# Multi-Target Acoustic Tracking Model Configuration (Li & Coates Paper)

_target_: src.models.acoustic_tracking_full.AcousticTrackingFullModel

# 4 targets, 16-dimensional state, 25 sensors
n_targets: 4
sensor_grid_size: 5

# Source parameters (from Li & Coates paper Section V)
source_intensity: 10.0        # Psi = 10
regularization: 0.1           # d_0 = 0.1

# Measurement noise (sigma_w^2 = 0.01)
measurement_noise_std: 0.1

# Use filter process noise (V_filter) by default
# Set to true to use V_true for data generation
use_true_process_noise: false

dt: 1.0
