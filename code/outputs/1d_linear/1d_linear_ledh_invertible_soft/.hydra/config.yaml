model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F:
  - - 0.95
  B:
  - - 0.5
  H:
  - - 1.0
  D:
  - - 0.3
  mu_0:
  - 0.0
  Sigma_0:
  - - 1.0
filter:
  _target_: src.filters.particle.ledh_invertible.LEDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 29
  resample_threshold: 0.5
  resampling_method: soft
  resampling_config:
    alpha: 0.5
seed: 42
dtype: float64
T: 100
output_dir: outputs/1d_linear/1d_linear_ledh_invertible_soft
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
