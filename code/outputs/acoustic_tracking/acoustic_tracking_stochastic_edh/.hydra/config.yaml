model:
  _target_: src.models.acoustic_tracking.AcousticTrackingModel
  sensor_positions:
  - - 0.0
    - 0.0
  - - 40.0
    - 0.0
  - - 0.0
    - 40.0
  - - 40.0
    - 40.0
  source_intensity: 10.0
  regularization: 0.1
  measurement_noise_std: 0.1
