model:
  _target_: src.models.acoustic_tracking_full.AcousticTrackingFullModel
  n_targets: 4
  sensor_grid_size: 5
  source_intensity: 10.0
  regularization: 0.1
  measurement_noise_std: 0.1
  use_true_process_noise: false
  dt: 1.0
filter:
  _target_: src.filters.kalman.unscented_kalman.UnscentedKalmanFilter
  alpha: 0.001
  beta: 2.0
  kappa: 0.0
seed: 42
dtype: float64
T: 50
output_dir: outputs/acoustic_tracking/acoustic_tracking_ukf
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
