model:
  _target_: src.models.acoustic_tracking_full.AcousticTrackingFullModel
  n_targets: 4
  sensor_grid_size: 5
  source_intensity: 10.0
  regularization: 0.1
  measurement_noise_std: 0.1
  use_true_process_noise: false
  dt: 1.0
filter:
  _target_: src.filters.particle.ledh_invertible.LEDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 37
  resample_threshold: 0.5
  geometric_ratio: 1.2
seed: 42
dtype: float32
T: 100
output_dir: outputs/acoustic_tracking/ledh_invertible_q1.2_n37
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
