model:
  _target_: src.models.cubic_sensor.CubicSensorModel
  a: 0.9
  c: 0.05
  sigma_V: 1.0
  sigma_W: 1.0
  initial_var: 5.0
filter:
  _target_: src.filters.particle.bootstrap_pf_tf.ParticleFilterTF
  _recursive_: false
  n_particles: 1000
  resample_threshold: 0.5
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
    max_iter: 100
    convergence_threshold: 0.001
    epsilon_scaling: 0.9
seed: 42
dtype: float64
T: 200
output_dir: outputs/cubic_sensor/cubic_sensor_pf_ot
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
