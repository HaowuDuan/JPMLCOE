dtype: float32
tf_log_level: 2
model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F:
  - - 0.9
    - 0.1
  - - 0.0
    - 0.8
  B:
  - - 1.0
  - - 0.5
  H:
  - - 1.0
    - 0.0
  D:
  - - 1.0
  mu_0:
  - 0.0
  - 0.0
  Sigma_0:
  - - 1.0
    - 0.0
  - - 0.0
    - 1.0
  process_noise_std: 0.5
  obs_noise_std: 1.0
filter:
  _target_: src.filters.kalman.extended_kalman.ExtendedKalmanFilter
  sample_initial_mean: false
dpf:
  sampler: hmc
  trainable_params:
    process_noise_std:
      init_value: 0.5
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
    obs_noise_std:
      init_value: 1.0
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
  hmc:
    num_samples: 10
    num_burnin: 5
    step_size: 0.01
    num_leapfrog_steps: 10
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.75
    seed: 42
data:
  T: 200
  seed: 42
  true_params:
    process_noise_std: 1.0
    obs_noise_std: 0.5
output:
  save_samples: true
  plot_posteriors: true
