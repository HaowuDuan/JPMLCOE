dtype: float64
tf_log_level: 2
model:
  _target_: src.models.cubic_sensor.CubicSensorModel
  a: 0.9
  c: 0.05
  sigma_V: 2.0
  sigma_W: 2.0
  initial_var: 5.0
filter:
  _target_: src.filters.particle.bootstrap_pf_hmc.BootstrapPFHMC
  n_particles: 1000
  resampling_method: ot_entropy
  resampling_config:
    epsilon: 0.5
  stop_gradient_resampling: false
  hmc_resampling_method: ot_entropy
  hmc_resampling_config:
    epsilon: 0.5
  always_resample: true
  eager_mode: false
dpf:
  sampler: custom_hmc
  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
  hmc:
    num_samples: 200
    num_burnin: 200
    step_size: 0.001
    num_leapfrog_steps: 5
    max_tree_depth: 10
    adaptation_rate: 0.8
    target_accept_prob: 0.9
    seed: 42
    grad_clip_norm: 100.0
data:
  T: 50
  seed: 42
  true_params:
    sigma_V: 1.0
    sigma_W: 1.0
