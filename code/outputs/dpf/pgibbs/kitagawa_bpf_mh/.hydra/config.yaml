dtype: float64
tf_log_level: 2
model:
  _target_: src.models.kitagawa.KitagawaModel
  sigma_V: 5.0
  sigma_W: 2.0
  initial_var: 5.0
filter:
  _target_: src.filters.particle.conditional_smc.BootstrapConditionalSMC
  n_particles: 1000
  resample_threshold: 0.5
  ancestor_sampling: true
dpf:
  sampler: pgibbs
  trainable_params:
    sigma_V:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 2.3
        scale: 0.5
    sigma_W:
      constraint: positive
      prior:
        _target_: tensorflow_probability.distributions.LogNormal
        loc: 0.0
        scale: 1.0
  pgibbs:
    theta_sampler: mh
    num_samples: 3
    num_burnin: 2
    mh_proposal_std: 0.1
    mh_steps_per_iter: 1
    seed: 42
data:
  T: 100
  seed: 42
  true_params:
    sigma_V: 10.0
    sigma_W: 1.0
