model:
  _target_: src.models.range_bearing.RangeBearingModel
  sigma_range: 0.1
  sigma_bearing: 0.1
filter:
  _target_: src.filters.particle.kernel_flow.KernelMappingPF
  n_particles: 20
  kernel_type: scalar
  max_iter: 500
  initial_dt: 0.05
  convergence_tol: 0.01
  alpha: null
  localization_radius: 4.0
  use_preconditioner: true
  adaptive_dt: true
seed: 42
dtype: float64
T: 100
output_dir: outputs/range_bearing/range_bearing_kernel_scalar
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
