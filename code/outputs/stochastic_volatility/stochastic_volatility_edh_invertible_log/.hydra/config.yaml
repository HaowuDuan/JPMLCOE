model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.91
  sigma: 1.0
  beta: 0.5
  log_space: true
filter:
  _target_: src.filters.particle.edh_invertible.EDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 29
  resample_threshold: 0.5
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility/stochastic_volatility_edh_invertible_log
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
