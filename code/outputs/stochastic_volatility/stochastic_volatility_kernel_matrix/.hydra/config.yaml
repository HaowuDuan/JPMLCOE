model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.91
  sigma: 1.0
  beta: 0.5
filter:
  _target_: src.filters.particle.kernel_flow.KernelMappingPF
  n_particles: 20
  kernel_type: matrix
  max_iter: 2000
  initial_dt: 0.05
  convergence_tol: 0.01
  alpha: null
  localization_radius: 4.0
  use_preconditioner: true
  adaptive_dt: true
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility/stochastic_volatility_kernel_matrix
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
