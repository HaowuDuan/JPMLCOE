model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.91
  sigma: 1.0
  beta: 0.5
filter:
  _target_: src.filters.kalman.kalman.KalmanFilter
  F:
  - - 0.91
  B:
  - - 1.0
  H:
  - - 0.0
  D:
  - - 0.5
  mean_0:
  - 0.0
  Sigma_0:
  - - 5.8172
  use_joseph_form: true
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility/stochastic_volatility_kf
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
