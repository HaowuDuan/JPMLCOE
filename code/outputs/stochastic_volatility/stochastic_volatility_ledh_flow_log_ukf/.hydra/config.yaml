model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.91
  sigma: 1.0
  beta: 0.5
  log_space: true
filter:
  _target_: src.filters.particle.ledh_flow.LocalExactDaumHuangFlow
  n_particles: 500
  n_lambda_steps: 29
  integration_method: euler
  use_feedback: true
  regularization: 1.0e-05
  n_threads: null
  filter_type: ukf
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility/stochastic_volatility_ledh_flow_log_ukf
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
