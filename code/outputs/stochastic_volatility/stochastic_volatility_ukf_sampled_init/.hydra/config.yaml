model:
  _target_: src.models.stochastic_volatility.StochasticVolatilityModel
  alpha: 0.91
  sigma: 1.0
  beta: 0.5
filter:
  _target_: src.filters.kalman.unscented_kalman.UnscentedKalmanFilter
  alpha: 0.001
  beta: 2.0
  kappa: 0.0
  sample_initial_mean: true
  random_seed: 42
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility/stochastic_volatility_ukf_sampled_init
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
