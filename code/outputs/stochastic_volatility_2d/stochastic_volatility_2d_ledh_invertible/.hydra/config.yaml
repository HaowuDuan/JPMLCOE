model:
  _target_: src.models.stochastic_volatility_2d.StochasticVolatility2DModel
  a1: 0.95
  a2: 0.91
  sigma1: 0.5
  sigma2: 1.0
  b: 1.0
filter:
  _target_: src.filters.particle.ledh_invertible.LEDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 29
  resample_threshold: 0.5
seed: 42
dtype: float64
T: 500
output_dir: outputs/stochastic_volatility_2d/stochastic_volatility_2d_ledh_invertible
plot: true
device: auto
tf_log_level: 2
verbose: true
show_progress: true
