# @package _global_

# Experiment: Stochastic EDH with Fine Integration on Range-Bearing Model
# Tests stochastic EDH with more lambda steps for smoother flow

defaults:
  - override /model: range_bearing
  - override /filter: stochastic_edh

# Override filter settings for finer integration
filter:
  n_lambda_steps: 200  # Double the steps for smoother integration
  diffusion_scale: 0.001
  use_optimal_schedule: false
  use_ekf_covariance: true

# Override settings
T: 100
seed: 42
plot: true
output_dir: outputs/range_bearing/range_bearing_stochastic_edh_fine
