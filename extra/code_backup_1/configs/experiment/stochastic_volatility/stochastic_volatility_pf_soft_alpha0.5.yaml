# @package _global_

# Experiment: Bootstrap Particle Filter with Soft Resampling (alpha=0.5) on Stochastic Volatility
# Lower alpha = more uniform sampling, better gradient flow, more exploration

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_soft

# Override settings
T: 500
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_soft_alpha0.5

# Override filter parameters
filter:
  resampling_config:
    alpha: 0.5  # More uniform, better for gradient-based learning

