model:
  _target_: src.models.acoustic_tracking_lite.AcousticTrackingLiteModel
  sensor_grid_size: 5
  source_intensity: 10.0
  regularization: 0.1
  measurement_noise_std: 0.1
  use_true_process_noise: false
  dt: 1.0
filter:
  _target_: src.filters.particle.edh_invertible.EDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 29
  filter_type: ekf
  resample_threshold: 0.5
seed: 42
T: 50
output_dir: outputs/acoustic_tracking_lite/acoustic_tracking_lite_edh_invertible
plot: true
verbose: true
