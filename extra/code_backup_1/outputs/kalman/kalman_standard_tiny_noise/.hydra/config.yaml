model:
  _target_: src.models.linear_gaussian.LinearGaussianModel
  F:
  - - 0.95
    - 0.0
  - - 0.0
    - 0.95
  B:
  - - 1.0
    - 0.0
  - - 0.0
    - 1.0
  H:
  - - 1.0
    - 0.0
  - - 0.0
    - 1.0
  D:
  - - 1.0e-08
    - 0.0
  - - 0.0
    - 1.0e-08
  mu_0:
  - 0.0
  - 0.0
  Sigma_0:
  - - 1.0
    - 0.0
  - - 0.0
    - 1.0
filter:
  _target_: src.filters.kalman.kalman.KalmanFilter
  F: ${model.F}
  B: ${model.B}
  H: ${model.H}
  D: ${model.D}
  mean_0: ${model.mu_0}
  Sigma_0: ${model.Sigma_0}
  use_joseph_form: false
seed: 42
T: 200
output_dir: outputs/kalman/kalman_standard_tiny_noise
plot: true
verbose: true
