# @package _global_

# Experiment: Bootstrap Particle Filter with OT Resampling (epsilon=0.1) on Stochastic Volatility
# Lower epsilon = closer to hard resampling, less smoothing, more transport bias

defaults:
  - override /model: stochastic_volatility
  - override /filter: particle_tf_ot

# Override settings
T: 500
seed: 42
plot: true
output_dir: outputs/stochastic_volatility/stochastic_volatility_pf_ot_eps0.1

# Override filter parameters for lower entropy
filter:
  resampling_config:
    epsilon: 0.1  # Less entropy regularization = sharper transport
    max_iter: 150  # May need more iterations for convergence
    convergence_threshold: 0.001
    epsilon_scaling: 0.85  # Slower reduction for stability

