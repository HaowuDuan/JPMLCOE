# Bootstrap Particle Filter - TensorFlow with Optimal Transport Resampling
# OT resampling is fully differentiable and minimizes transport cost + entropy

_target_: src.filters.particle.bootstrap_pf_tf.ParticleFilterTF

# Model will be passed at runtime from experiment
_recursive_: false

n_particles: 1000          # Number of particles
resample_threshold: 0.5    # Resample when ESS/N < threshold

# Optimal transport resampling configuration
resampling_method: 'ot_entropy'  # String identifier for ot_entropy_resample

resampling_config:
  epsilon: 0.5               # Entropy regularization parameter
                             # Smaller = closer to hard resampling (more transport bias)
                             # Larger = more smoothing (less transport bias)
  max_iter: 100              # Maximum Sinkhorn iterations
  convergence_threshold: 0.001  # Convergence threshold for Sinkhorn
  epsilon_scaling: 0.9       # Epsilon reduction factor for epsilon-scaling
                             # Larger = faster reduction (may be less stable)

