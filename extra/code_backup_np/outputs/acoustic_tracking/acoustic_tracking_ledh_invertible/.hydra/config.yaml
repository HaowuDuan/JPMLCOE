model:
  _target_: src.models.acoustic_tracking.AcousticTrackingModel
  sensor_positions:
  - - 0.0
    - 0.0
  - - 40.0
    - 0.0
  - - 0.0
    - 40.0
  - - 40.0
    - 40.0
  source_intensity: 10.0
  regularization: 0.1
  measurement_noise_std: 0.1
  process_noise_cov: null
  dt: 1.0
filter:
  _target_: src.filters.particle.ledh_invertible.LEDHParticleFlowFilter
  n_particles: 500
  n_lambda_steps: 29
  filter_type: ekf
  resample_threshold: 0.5
seed: 42
T: 50
output_dir: outputs/acoustic_tracking/acoustic_tracking_ledh_invertible
plot: true
verbose: true
